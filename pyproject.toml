[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elliott-hybrid-scanner"
version = "0.1.0"
description = "Scanner diario de señales cripto: Elliott + confluencia técnica. Informativo, no ejecuta órdenes."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001: el proyecto escribe en castellano y usa tipografía real (×, —) en
# etiquetas de gráfico y comentarios. No es ambigüedad accidental.
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
