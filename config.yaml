# Elliott Hybrid Scanner — configuración única del sistema.
#
# Regla del proyecto: ningún valor numérico ni nombre de mercado vive en el
# código. Si algo se puede ajustar, se ajusta aquí.
#
# Las secciones de fases todavía no implementadas están marcadas como tal;
# contienen únicamente valores que la especificación ya fija (no inventados).

# ---------------------------------------------------------------------------
# Rutas y entorno
# ---------------------------------------------------------------------------
paths:
  data_dir: data # relativo a la raíz del repo
  cache_dir: data/cache # Parquet de OHLCV
  reports_dir: reports # informes de la fase 6
  plots_dir: plots # gráficos de validación visual
  web_dir: docs # dashboard HTML para GitHub Pages

# ---------------------------------------------------------------------------
# Exchanges — SOLO endpoints públicos. Este sistema nunca usa API keys.
# ---------------------------------------------------------------------------
#
# Nota importante sobre la elección de fuente (verificado empíricamente):
# el endpoint público de OHLC de Kraken IGNORA el parámetro `since` y devuelve
# siempre las últimas ~720 velas, sin paginación hacia atrás. Eso son 4 meses
# en 4h y 30 días en 1h — insuficiente para el walk-forward de la fase 5.
# Binance sí respeta `since` y pagina histórico completo, así que es la fuente
# primaria de la SERIE DE PRECIOS. Kraken queda como fallback para pares que
# Binance no liste, y como referencia de COMISIONES en el backtest.
exchanges:
  primary:
    id: binance
    quote: USDT
    # Binance geo-bloquea las IPs de los runners de GitHub (EE.UU.). Su
    # endpoint oficial solo-datos no tiene esa restricción y sirve exactamente
    # los mismos datos públicos, así que se usa siempre. `fetchMarkets: [spot]`
    # es imprescindible: sin ello load_markets consulta también futuros
    # (fapi/dapi), que no pasan por este override y siguen bloqueados.
    public_api_url: https://data-api.binance.vision/api/v3
    ccxt_options:
      fetchMarkets: [spot]
  fallback:
    id: kraken
    quote: USD

  # Excepciones puntuales base -> símbolo completo, por si algún ticker no
  # sigue el patrón "{base}/{quote}".
  symbol_overrides:
    binance: {}
    kraken: {}

  # ccxt aplica su propio throttle por exchange cuando enable_throttle=true.
  # extra_sleep_ms añade margen por encima de ese throttle si vemos 429s.
  rate_limit:
    enable_throttle: true
    extra_sleep_ms: 0

  # Reintentos con backoff exponencial ante errores transitorios de red o
  # rate limit. Los errores permanentes (símbolo inexistente) no se reintentan.
  retry:
    max_attempts: 5
    base_delay_s: 1.0
    backoff_factor: 2.0
    max_delay_s: 60.0
    jitter: true

# ---------------------------------------------------------------------------
# Universo de pares
# ---------------------------------------------------------------------------
# Solo la base: el símbolo se construye con el `quote` de cada exchange.
#
# POL (ex-MATIC) queda excluido: su histórico arranca el 2024-09-13, cuando se
# creó el ticker tras el rename, y son ~1,9 años — por debajo del mínimo de
# `backtest.min_history_years`. Empalmarlo con MATIC no es válido: el rename
# implicó migración de contrato y las series no son comparables.
universe:
  bases:
    - BTC
    - ETH
    - SOL
    - BNB
    - XRP
    - ADA
    - AVAX
    - LINK
    - DOT
    # Añadidos a petición para el escaneo diario (2026-08). El backtest y el
    # holdout se validaron con los 9 anteriores; estos participan del scanner
    # con las mismas reglas pero sin validación retrospectiva propia.
    - PEPE
    - DOGE
    - SUI
    - TRX

# ---------------------------------------------------------------------------
# Timeframes
# ---------------------------------------------------------------------------
# context   -> alineación de tendencia mayor (fase 4)
# structure -> conteo de ondas y detección de swings (fases 2-3)
# timing    -> afinado de la zona de entrada (fase 4)
timeframes:
  context: 1d
  structure: 4h
  timing: 1h

# ---------------------------------------------------------------------------
# Descarga e histórico
# ---------------------------------------------------------------------------
history:
  # La fase 5 exige un mínimo de 2 años. Con margen para el warm-up de
  # indicadores y para que el walk-forward tenga varios folds.
  start_date: "2022-01-01"

  # Velas por página. Binance admite 1000; ccxt recorta al máximo del venue.
  page_limit: 1000

  # Al hacer descarga incremental se re-piden las últimas N velas ya cacheadas.
  # Cubre revisiones tardías del exchange sin re-bajar el histórico entero.
  overlap_candles: 2

  # CRÍTICO: descarta la vela en curso (aún sin cerrar). Una vela parcial tiene
  # un `close` que todavía se mueve; dejarla entrar contamina swings, ATR e
  # indicadores con información que en producción no existiría.
  drop_incomplete_candle: true

# ---------------------------------------------------------------------------
# Validación de integridad de los datos
# ---------------------------------------------------------------------------
# Política por tipo de anomalía:
#   warn     -> se registra en el informe, el dato pasa
#   raise    -> aborta la ingesta del par
#   fix/drop -> se corrige o elimina automáticamente
#
# Por qué los huecos son `warn` y no `raise`: aunque el cripto cotiza 24/7,
# los exchanges tienen paradas de mantenimiento y ventanas sin trades en pares
# poco líquidos. Abortar ante el primer hueco dejaría el sistema sin datos por
# un incidente de hace dos años. Se reportan y se decide con el ratio.
validation:
  on_gap: warn
  on_zero_volume: warn
  on_duplicate: fix
  on_ohlc_inconsistency: warn

  # Si la proporción de velas ausentes supera este ratio, el par se marca como
  # no apto independientemente de la política anterior.
  max_gap_ratio: 0.01

  # Mínimo de velas para considerar utilizable una serie.
  min_candles: 200

# ===========================================================================
# FASE 2 — Detección de swings
# ===========================================================================
swings:
  atr_period: 14

  # Umbral del ZigZag expresado en múltiplos de ATR. Es el parámetro MÁS
  # sensible del sistema: gobierna cuántos pivotes se detectan y, por tanto,
  # qué conteos de Elliott son siquiera posibles.
  #
  # Rango razonable: 1.0 - 5.0
  #   < 1.5  ruido: pivotes de grado menor, conteos que se invalidan solos
  #   2.0-3.0 zona de trabajo para 4h en majors (punto de partida: 2.5)
  #   > 4.0  solo swings mayores: pocos pivotes, se pierden ondas 4 y 5
  # Debe recalibrarse por timeframe; lo que funciona en 4h no funciona en 1h.
  # Fijado en 3.0 tras validar a ojo la comparativa sobre BTC/USDT 4h.
  atr_threshold: 3.0

  # Un pivote no se confirma hasta que han cerrado N velas posteriores sin
  # invalidarlo. Es lo que garantiza la ausencia de lookahead bias: en la vela
  # t solo son visibles los pivotes confirmados en t-N o antes.
  confirmation_bars: 3

  # Qué ATR mide el umbral de reversión:
  #   extreme -> el ATR de la vela donde está el extremo candidato. El umbral
  #              queda anclado a la volatilidad del swing que se está midiendo,
  #              y no se mueve mientras se espera la reversión.
  #   current -> el ATR de la vela que se está evaluando. Se adapta más rápido
  #              a cambios de volatilidad, pero un pico de volatilidad puede
  #              impedir que se confirme un pivote ya formado.
  atr_reference: extreme

# ---------------------------------------------------------------------------
# Gráficos de validación visual
# ---------------------------------------------------------------------------
plots:
  lookback_candles: 400 # velas mostradas; null para la serie entera
  figsize: [17, 9]
  dpi: 130

# ===========================================================================
# FASE 3 — Validador Elliott
# ===========================================================================
#
# Enfoque descartador: el validador dice si un conteo es estructuralmente
# posible, no cuál es el conteo correcto. Cuando la secuencia admite más de una
# lectura, devuelve todas las hipótesis marcadas como tales.
elliott:
  hard_rules:
    wave2_max_retrace: 1.0 # onda 2 no retrocede >100% de la onda 1
    wave3_never_shortest: true
    wave4_no_overlap_wave1: true

    # Las diagonales son hipótesis aparte, no una excepción dentro de la regla
    # del solape. Siguiendo a Frost & Prechter, el solape de la onda 4 con la 1
    # es su rasgo definitorio (obligatorio) y además exigen forma de cuña:
    #   contractiva: 3<1, 5<3, 4<2   — la variante habitual
    #   expansiva:   3>1, 5>3, 4>2   — rara; desactivada por defecto
    allow_diagonals: true
    allow_expanding_diagonals: false

  soft_guides:
    wave2_retrace_range: [0.5, 0.786]
    wave3_extension_target: 1.618

  # Pesos de las guías blandas en el score. Solo puntúan: ninguna invalida.
  # Se normalizan al sumar, así que importan las proporciones, no la escala.
  guide_weights:
    wave2_retracement: 0.35
    wave3_extension: 0.40
    alternation: 0.25

  # Tolerancia relativa al comparar con ratios de Fibonacci. El score vale 1
  # dentro de esta distancia relativa al objetivo y decae hasta 0 a cuatro
  # veces esa distancia.
  ratio_tolerance: 0.05

# ===========================================================================
# FASE 4 — Capa de confluencia
# ===========================================================================
#
# Cinco factores independientes, cada uno con score normalizado 0-1. El score
# final es su media ponderada, pero la condición de emisión no es el score:
# hacen falta al menos `min_active_factors` por encima de su umbral. Un solo
# factor fuerte no basta por muy alto que puntúe.
confluence:
  weights:
    fibonacci: 0.25
    rsi_divergence: 0.20
    market_structure: 0.20
    volume_profile: 0.15
    higher_timeframe_trend: 0.20

  # Umbral por factor para contarlo como "activo".
  thresholds:
    fibonacci: 0.6
    rsi_divergence: 0.6
    market_structure: 0.6
    volume_profile: 0.6
    higher_timeframe_trend: 0.6

  min_active_factors: 3

  rsi_period: 14

  fibonacci:
    retracements: [0.618, 0.786]
    extensions: [1.618]
    # Clusters: niveles entre ondas (igualdad C=A, retrocesos del impulso
    # completo) con bonus por confluencia. PROBADO Y NO ADOPTADO (2026-08-08):
    # en el periodo de desarrollo dio esperanza +1.83% vs +1.90% y PF 1.62 vs
    # 1.65 — ligeramente peor. Se conserva tras este flag por si se quiere
    # re-evaluar con más datos; el holdout no se tocó.
    clusters: false
    cluster_bonus: 0.15
    # Distancia al nivel, medida en ATR, a la que el score cae a 0. En ATR y no
    # en porcentaje para que signifique lo mismo en cualquier par.
    tolerance_atr: 0.75

  rsi_divergence:
    # Diferencia de RSI entre los dos extremos que satura el score.
    full_scale_points: 10.0

  market_structure:
    # Antigüedad máxima, en velas del timeframe de contexto, de un BOS o CHoCH
    # para que siga contando. La antigüedad se mide desde que ocurrió la
    # ruptura, no desde que se formó el nivel roto: un BOS es un evento.
    lookback_bars: 20
    # El ZigZag del timeframe de contexto lleva su propio umbral. El de la
    # fase 2 está calibrado en 4h; aplicado al diario deja pivotes tan escasos
    # que la estructura casi nunca llega a romperse.
    swing_atr_period: 14
    swing_atr_threshold: 2.0
    swing_confirmation_bars: 2

  volume_profile:
    # vol(onda 3) / vol(onda 1) que satura la parte de expansión.
    expansion_target: 1.5
    # vol(onda 4) / vol(onda 3) que satura la parte de contracción.
    contraction_target: 0.7

  higher_timeframe_trend:
    ema_period: 50
    atr_period: 14
    # Desviación del precio respecto a la EMA, en ATR, que satura la fuerza de
    # la tendencia diaria.
    strength_atr: 2.0

# ===========================================================================
# FASE 5 — Backtest
# ===========================================================================
backtest:
  min_history_years: 2

  walk_forward:
    train_months: 12
    test_months: 3
    # Único parámetro que se elige con datos. El resto se fijaron por criterio,
    # así que sobre ellos el walk-forward no aporta nada y no se finge que sí.
    min_active_grid: [2, 3, 4]
    # Por debajo de estas operaciones el tramo de entrenamiento no decide nada
    # y se usa el valor por defecto de `confluence.min_active_factors`.
    min_train_trades: 10

  # Periodo reservado que NO se toca durante el desarrollo. Todo lo que se
  # explore y ajuste se hace con datos anteriores a esta fecha; el holdout se
  # evalúa UNA vez al final. Es lo que separa un resultado creíble de un número
  # fabricado a base de iterar.
  holdout_start: "2025-02-01"

  # Cómo se entra tras la señal:
  #   market     -> apertura de la vela siguiente, pagando taker
  #   limit_zone -> limitada en la zona de Fibonacci de la señal, pagando
  #                 maker. Si el precio no visita la zona, no hay operación.
  #
  # La ablación sobre el periodo de desarrollo descartó limit_zone: selección
  # adversa. Cuando el precio no vuelve a la zona es porque el movimiento es
  # fuerte, así que la limitada se pierde los mejores y se queda los flojos
  # (esperanza -0.68% frente a +1.13% con market en las mismas señales).
  entry:
    mode: market
    limit_valid_bars: 10

  # Filtros previos a la apertura, con información ya conocida:
  filters:
    # Desactivado: con entrada a mercado no mostró efecto en la ablación y un
    # parámetro sin efecto es solo una oportunidad de sobreajustar.
    min_reward_cost_ratio: 0.0
    # Solo largos. Justificable a priori (en spot sin margen los cortos no son
    # ejecutables tal cual) y confirmado en el periodo de desarrollo: los
    # cortos rinden -0.73% por operación frente a +1.13% de los largos.
    directions: [bullish]

  # Reglas de salida. Son una decisión del backtest, no de la señal: la
  # especificación define cuándo se emite pero no cuándo se cierra. No se
  # optimizan; ajustarlas para mejorar el resultado sería sobreajuste.
  exits:
    target_r: 2.0 # objetivo como múltiplo del riesgo
    max_bars: 30 # cierre por tiempo, en velas del timeframe de estructura

  # Con `false` se ignora una señal si aún hay posición abierta en ese par.
  allow_overlap: false

  # Costes reales, en porcentaje y **por lado**. El viaje completo los paga dos
  # veces: 2 × (0.26 + 0.05 + 0.03) = 0.68%. Sin esto los números mienten.
  # Kraken taker del tier base; ajustar si el volumen mensual cambia de tier.
  costs:
    taker_fee_pct: 0.26
    maker_fee_pct: 0.16 # no se usa: se asume ejecución agresiva siempre
    slippage_pct: 0.05
    spread_pct: 0.03

  baselines:
    buy_and_hold: true
    random_signals: true
    random_trials: 1000
    seed: 20240101
    alpha: 0.05

# ===========================================================================
# FASE 6 — Reporte diario (aún no implementada)
# ===========================================================================
report:
  format: markdown
  top_n: 10
  include_alternate_counts: true
  # Frecuencias históricas de desenlace, mostradas en la web como "posible
  # siguiente movimiento". Fuente: backtest del periodo de DESARROLLO (2022 →
  # holdout_start), 195 operaciones solo-largos, universo actual, medido el
  # 2026-08-15 con `scripts/backtest.py --trades` contando exit_reason.
  # Son descriptivas (no tocan la lógica de señales) y NO se editan a mano:
  # solo se actualizan re-ejecutando ese comando.
  projection:
    n_trades: 195
    target_pct: 21.5 # llegó al objetivo +2R
    stop_pct: 34.9 # tocó el stop −1R
    timeout_pct: 43.6 # cerró por tiempo (30 velas)
    timeout_avg_pct: 1.4 # resultado medio de los cierres por tiempo
    expectancy_pct: 1.9 # esperanza neta por operación

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"
