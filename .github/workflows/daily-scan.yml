# Escaneo diario: descarga las velas nuevas, genera el informe y lo commitea.
#
# No necesita ningún secreto: los datos vienen de endpoints públicos y el
# commit del informe usa el GITHUB_TOKEN automático del workflow. Si algún día
# se añade una integración (Telegram, Notion), sus credenciales irán en
# GitHub Secrets — nunca en el código ni en este fichero.
#
# La caché Parquet se conserva entre ejecuciones vía actions/cache, así que
# cada día solo se descargan las velas nuevas.

name: daily-scan

on:
  schedule:
    # Cada 4 horas, a los 20 min del cierre de cada vela de 4h. El cron de
    # GitHub puede retrasarse varios minutos; con caché el run tarda ~3 min.
    - cron: "20 0,4,8,12,16,20 * * *"
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write # commitear el informe
  issues: write # abrir un issue de aviso cuando aparece una señal nueva

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Restaurar caché de velas
        uses: actions/cache@v4
        with:
          path: data/cache
          # La clave cambia cada día: se restaura la más reciente por prefijo
          # y se guarda la actualizada al terminar.
          key: ohlcv-${{ github.run_id }}
          restore-keys: |
            ohlcv-

      - name: Tests (barrera de seguridad)
        run: python -m pytest -q

      - name: Guardar registro previo de señales
        run: cp reports/signals.json /tmp/signals_prev.json 2>/dev/null || echo "[]" > /tmp/signals_prev.json

      - name: Descargar velas nuevas y generar informe
        run: python scripts/daily_report.py

      - name: Avisar de señales nuevas (issue de GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYEOF'
          import json, pathlib, subprocess

          prev = {(s["symbol"], s["timestamp"]) for s in json.loads(pathlib.Path("/tmp/signals_prev.json").read_text())}
          ahora = json.loads(pathlib.Path("reports/signals.json").read_text()) if pathlib.Path("reports/signals.json").exists() else []
          nuevas = [s for s in ahora if (s["symbol"], s["timestamp"]) not in prev]
          for s in nuevas:
              base = s["symbol"].split("/")[0]
              titulo = f"🎯 Señal de compra: {base}"
              zona = f"{s['zone_low']:g}–{s['zone_high']:g}" if s.get("zone_low") else "—"
              cuerpo = (
                  f"**{s['symbol']}** · confirmada {s['timestamp']}\n\n"
                  f"- Zona de compra: {zona}\n- Stop: {s['stop']:g}\n"
                  f"- Comprobaciones: {', '.join(s['factors'])}\n\n"
                  f"[Ver en la web](https://peperonioo.github.io/elliott-hybrid-scanner/)\n\n"
                  f"_Informativo, no es asesoramiento financiero._"
              )
              subprocess.run(["gh", "issue", "create", "--title", titulo, "--body", cuerpo,
                              "--label", "señal"], check=False)
          print(f"señales nuevas: {len(nuevas)}")
          PYEOF

      - name: Commitear el informe
        run: |
          git config user.name "ehs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ docs/
          if git diff --cached --quiet; then
            echo "Sin cambios en el informe"
          else
            git commit -m "informe: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Subir informe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: informe-${{ github.run_id }}
          path: reports/latest.md
          retention-days: 30
